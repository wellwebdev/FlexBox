<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flexbox · pricing cards</title>
</head>
<body>
  <div class="pricing-grid">

    <!-- BASIC card -->
    <div class="price-card">
      <div class="plan-name">Basic</div>
      <div class="price">$11.99 <span>/month</span></div>
      <ul class="feature-list">
        <li>✅ 10GB Storage</li>
        <li>✅ 1 User</li>
        <li>✅ Support</li>
      </ul>
      <!-- flex item inside nested flex column (button stays at bottom) -->
      <button class="btn">Sign Up</button>
    </div>

    <!-- STANDARD card -->
    <div class="price-card">
      <div class="plan-name">Standard</div>
      <div class="price">$19.99 <span>/month</span></div>
      <ul class="feature-list">
        <li>✅ 50GB Storage</li>
        <li>✅ 5 Users</li>
        <li>✅ Phone & Email Support</li>
      </ul>
      <button class="btn">Sign Up</button>
    </div>

    <!-- PREMIUM card -->
    <div class="price-card">
      <div class="plan-name">Premium</div>
      <div class="price">$49.99 <span>/month</span></div>
      <ul class="feature-list">
        <li>✅ 100GB Storage</li>
        <li>✅ 10 Users</li>
        <li>✅ 24/7 Support</li>
      </ul>
      <button class="btn">Sign Up</button>
    </div>

  </div>
</body>
</html>
